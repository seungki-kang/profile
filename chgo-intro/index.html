<!DOCTYPE html>
<html lang="ko">
<head>
    <title>CHGO Platform</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CHGO Platform</h1>
    <p>AI와 온톨로지를 활용해 개인과 공동체의 성장을 지원하는 플랫폼</p>

    <h2>CHGO의 주요 특징</h2>

<div class="card-container">

    <div class="card">
        <h3>인간 성장</h3>
        <p>개인의 내면 성장과 삶의 변화를 지원합니다.</p>
    </div>

    <div class="card">
        <h3>AI 코칭</h3>
        <p>AI를 활용하여 개인의 성찰과 성장을 지원합니다.</p>
    </div>

    <div class="card">
        <h3>교회 공동체 연결</h3>
        <p>개인의 성장이 공동체의 성장으로 연결되도록 지원합니다.</p>
    </div>

</div>

        
</body>
</html>
